name: L1 Staging Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit SHA to build for staging
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare-release-candidate:
    name: Prepare immutable staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    env:
      NODE_ENV: production
      KNOWLEDGE_AI_PERSISTENCE_MODE: postgres
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: ${{ vars.DATABASE_SSL }}
      KNOWLEDGE_AI_PUBLIC_ORIGIN: ${{ vars.KNOWLEDGE_AI_PUBLIC_ORIGIN }}

      SOURCE_STORAGE_BACKEND: ${{ vars.SOURCE_STORAGE_BACKEND }}
      SOURCE_STORAGE_BUCKET: ${{ vars.SOURCE_STORAGE_BUCKET }}
      SOURCE_STORAGE_REGION: ${{ vars.SOURCE_STORAGE_REGION }}
      SOURCE_STORAGE_ENDPOINT: ${{ vars.SOURCE_STORAGE_ENDPOINT }}
      SOURCE_STORAGE_ACCESS_KEY_ID: ${{ secrets.SOURCE_STORAGE_ACCESS_KEY_ID }}
      SOURCE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_STORAGE_SECRET_ACCESS_KEY }}
      SOURCE_STORAGE_FORCE_PATH_STYLE: ${{ vars.SOURCE_STORAGE_FORCE_PATH_STYLE }}

      KNOWLEDGE_AI_SECRET_ACTIVE_KEY_ID: ${{ vars.KNOWLEDGE_AI_SECRET_ACTIVE_KEY_ID }}
      KNOWLEDGE_AI_SECRET_KEYRING_JSON: ${{ secrets.KNOWLEDGE_AI_SECRET_KEYRING_JSON }}

      KNOWLEDGE_AI_STAGING_IDENTITY_JSON: ${{ vars.KNOWLEDGE_AI_STAGING_IDENTITY_JSON }}
      KNOWLEDGE_AI_PRODUCTION_IDENTITY_JSON: ${{ vars.KNOWLEDGE_AI_PRODUCTION_IDENTITY_JSON }}

    steps:
      - name: Validate immutable source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a 40-character lowercase Git SHA."
            exit 1
          fi

      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1

      - name: Verify checkout identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Verify release npm version
        run: test "$(npm --version)" = "10.9.2"

      - name: Install dependencies from frozen lockfile
        run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Immutable GitHub Action pin gate
        run: npm run check:production:h4-action-pins

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate real staging environment contract
        env:
          KNOWLEDGE_AI_STAGING_PREFLIGHT_PATH: artifacts/staging-preflight.json
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run release:staging-preflight

      - name: Generate CycloneDX production SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > artifacts/knowledge-ai.sbom.cdx.json

      - name: Verify CycloneDX SBOM
        env:
          KNOWLEDGE_AI_SBOM_PATH: artifacts/knowledge-ai.sbom.cdx.json
        run: npm run check:production:h4-sbom -- artifacts/knowledge-ai.sbom.cdx.json

      - name: Derive immutable image identity
        id: meta
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          REPOSITORY="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="ghcr.io/$REPOSITORY"
          LOCAL_IMAGE="knowledge-ai:l1-$SOURCE_COMMIT"
          BUILD_ID="gh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "local_image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Build exact production image
        env:
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Scan release candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.local_image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push immutable release candidate
        id: push
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          LOCAL_IMAGE: ${{ steps.meta.outputs.local_image }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          TARGET="$IMAGE_REF:$SOURCE_COMMIT"
          docker tag "$LOCAL_IMAGE" "$TARGET"
          PUSH_OUTPUT="$(docker push "$TARGET")"
          printf '%s\n' "$PUSH_OUTPUT"
          DIGEST="$(printf '%s\n' "$PUSH_OUTPUT" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          if [ -z "$DIGEST" ]; then
            echo "Could not determine immutable GHCR digest."
            exit 1
          fi
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Generate H4 release manifest
        env:
          KNOWLEDGE_AI_RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          KNOWLEDGE_AI_RELEASE_BUILD_ID: ${{ steps.meta.outputs.build_id }}
          KNOWLEDGE_AI_RELEASE_IMAGE_REF: ${{ steps.push.outputs.image_target }}
          KNOWLEDGE_AI_RELEASE_IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          KNOWLEDGE_AI_RELEASE_SBOM_PATH: artifacts/knowledge-ai.sbom.cdx.json
          KNOWLEDGE_AI_RELEASE_DEPENDENCY_AUDIT: PASS
          KNOWLEDGE_AI_RELEASE_CONTAINER_SCAN: PASS
          KNOWLEDGE_AI_RELEASE_ACTION_PINS: PASS
          KNOWLEDGE_AI_RELEASE_MANIFEST_PATH: artifacts/release-manifest.json
        run: npm run release:manifest > /dev/null

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-staging-candidate-${{ inputs.source_commit }}
          path: |
            artifacts/release-manifest.json
            artifacts/staging-preflight.json
            artifacts/knowledge-ai.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish candidate summary
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          IMAGE_TARGET: ${{ steps.push.outputs.image_target }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          BUILD_ID: ${{ steps.meta.outputs.build_id }}
        run: |
          {
            echo "## L1 immutable staging candidate"
            echo
            echo "- Source commit: `$SOURCE_COMMIT`"
            echo "- Build ID: `$BUILD_ID`"
            echo "- Image: `$IMAGE_TARGET@$IMAGE_DIGEST`"
            echo "- H4 supply-chain gates: passed"
            echo "- Staging environment preflight: passed"
            echo
            echo "This workflow prepares the exact artifact for staging. L1 is not complete until a real provider deploys this digest and the migration/readiness/recovery evidence is captured."
          } >> "$GITHUB_STEP_SUMMARY"
