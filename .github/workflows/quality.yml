          node-version: 22.14.0

      - name: Verify release npm version
        run: test "$(npm --version)" = "10.9.2"

      - name: Install dependencies from frozen lockfile
        run: npm ci

      - name: Benchmark leakage guard
        run: npm run check:benchmark-leakage

      - name: LLM provider boundary guard
        run: npm run check:provider-boundary

      - name: Secret and runtime-state hygiene guard
        run: npm run check:secret-hygiene

      - name: Telemetry integrity guard
        run: npm run check:telemetry-integrity

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production H2 package layout proof
