name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KNOWLEDGE_AI_ALLOW_DEFAULT_WEB: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Benchmark leakage guard
        run: npm run check:benchmark-leakage

      - name: LLM provider boundary guard
        run: npm run check:provider-boundary

      - name: Secret and runtime-state hygiene guard
        run: npm run check:secret-hygiene

      - name: Telemetry integrity guard
        run: npm run check:telemetry-integrity

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Workspace isolation proof
        run: npm run check:workspace-isolation

      - name: Workspace HTTP isolation proof
        run: npm run check:workspace-http-isolation

      - name: Structured data foundation proof
        run: npm run check:structured-data-foundation

      - name: Dataset HTTP isolation proof
        run: npm run check:dataset-http-isolation

      - name: XLSX and schema correction proof
        run: npm run check:xlsx-schema

      - name: Deterministic structured analytics proof
        run: npm run check:deterministic-analytics

      - name: Analytical question routing proof
        run: npm run check:analytical-routing

      - name: Phase 1 UI contract proof
        run: npm run check:phase1-ui

      - name: Phase 2A discovery proof
        run: npm run check:phase2a-discovery

      - name: Phase 2B prioritization proof
        run: npm run check:phase2b-prioritization

      - name: Phase 2C change and deadline proof
        run: npm run check:phase2c-change-deadline

      - name: Phase 2D richer detector proof
        run: npm run check:phase2d-richer-detectors

      - name: Phase 2E Insights UI proof
        run: npm run check:phase2e-ui

      - name: Phase 3A/3B company knowledge proof
        run: npm run check:phase3ab-company-knowledge

      - name: Phase 3C cross-source knowledge proof
        run: npm run check:phase3c-cross-source

      - name: Phase 3D What changed proof
        run: npm run check:phase3d-what-changed

      - name: Phase 3E living Knowledge UI proof
        run: npm run check:phase3e-ui

      - name: Phase 4 safe actions proof
        run: npm run check:phase4-actions

      - name: Phase 4E Actions UI proof
        run: npm run check:phase4e-ui

      - name: Phase 5A/5B watch proof
        run: npm run check:phase5ab-watch

      - name: Phase 5C watch language proof
        run: npm run check:phase5c-watch-language

      - name: Phase 5D Watch scheduler proof
        run: npm run check:phase5d-watch-scheduler

      - name: Phase 5E alert lifecycle proof
        run: npm run check:phase5e-alert-lifecycle

      - name: Phase 5F smart reminder proof
        run: npm run check:phase5f-smart-reminders

      - name: Phase 5F Watch UI proof
        run: npm run check:phase5f-watch-ui

      - name: Phase 5 Watch quality evaluation
        run: npm run check:phase5-watch-quality

      - name: Phase 6A integration foundation proof
        run: npm run check:phase6a-integration-foundation

      - name: Phase 6B Google Drive proof
        run: npm run check:phase6b-google-drive

      - name: Phase 6C OneDrive proof
        run: npm run check:phase6c-onedrive

      - name: Phase 6D integration hardening proof
        run: npm run check:phase6d-integration-hardening

      - name: Phase 6E Integrations UI proof
        run: npm run check:phase6e-integrations-ui

      - name: Phase 7A automation policy proof
        run: npm run check:phase7a-automation-policy

      - name: Phase 7B approval enforcement proof
        run: npm run check:phase7b-approval-enforcement

      - name: Phase 7C auto-execution proof
        run: npm run check:phase7c-auto-execution

      - name: Phase 7D automation recovery proof
        run: npm run check:phase7d-automation-recovery

      - name: Phase 7E automation quality proof
        run: npm run check:phase7e-automation-quality

      - name: Phase 7E Automation UI proof
        run: npm run check:phase7e-automation-ui

      - name: Phase 8A stable platform API proof
        run: npm run check:phase8a-platform-api

      - name: Phase 8B registered tool proof
        run: npm run check:phase8b-registered-tools

      - name: Phase 8C custom detector proof
        run: npm run check:phase8c-custom-detectors

      - name: Phase 8D domain pack proof
        run: npm run check:phase8d-domain-packs

      - name: Phase 8E developer platform proof
        run: npm run check:phase8e-platform-ui

      - name: Arithmetic grounding proof guard
        run: npx tsx scripts/check-arithmetic-grounding.ts

      - name: Deterministic synthesis guard
        run: npx tsx scripts/check-deterministic-synthesis.ts

      - name: Unseen-corpus effectiveness benchmark
        run: npm run benchmark:unseen

      - name: Live Gemini unseen-corpus benchmark
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "LIVE_GEMINI_BENCHMARK_SKIPPED: GEMINI_API_KEY repository secret is not configured."
            exit 0
          fi
          npm run benchmark:unseen:gemini

  postgres-a2:
    name: Production A2 PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/knowledge_ai_test
      DATABASE_SSL: disable
      DATABASE_POOL_MAX: 5
      KNOWLEDGE_AI_PERSISTENCE_MODE: postgres
      KNOWLEDGE_AI_ALLOW_DEFAULT_WEB: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production A2 PostgreSQL proof
        run: npm run check:production-a2-postgres

      - name: Production A3 PostgreSQL proof
        run: npm run check:production-a3-postgres

      - name: Production A4 PostgreSQL proof
        run: npm run check:production-a4-postgres

      - name: Production A5 PostgreSQL proof
        run: npm run check:production-a5-postgres

      - name: Production A6 PostgreSQL proof
        run: npm run check:production-a6-postgres

      - name: Production A7 Discovery runtime proof
        run: npm run check:production-a7-discovery-runtime

      - name: Production A7B Integration runtime proof
        run: npm run check:production-a7b-integration-runtime

      - name: Production A7C Watch runtime proof
        run: npm run check:production-a7c-watch-runtime

      - name: Production A7D Living Knowledge Actions runtime proof
        run: npm run check:production:a7d-knowledge-actions-runtime

      - name: Production A7E Automation runtime proof
        run: npm run check:production:a7e-automation-runtime

      - name: Production A7F Platform runtime proof
        run: npm run check:production:a7f-platform-runtime

      - name: Production A7G Core metadata runtime proof
        run: npm run check:production:a7g-core-metadata-runtime

      - name: Production B2A identity foundation proof
        run: npm run check:production:b2a-identity-foundation

      - name: Production B2B1 auth session API proof
        run: npm run check:production:b2b1-auth-session-api

      - name: Production B2B2 request identity proof
        run: npm run check:production:b2b2-request-identity

      - name: Production B2C1 core route cutover proof
        run: npm run check:production:b2c1-core-route-cutover

      - name: Production B2C2 Insights and Company Knowledge proof
        run: npm run check:production:b2c2-insights-company-knowledge
