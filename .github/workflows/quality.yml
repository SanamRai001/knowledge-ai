  h2_image:
    name: Production H2 Image Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Verify release npm version
        run: test "$(npm --version)" = "10.9.2"

      - name: Build and smoke immutable production image
        run: node scripts/check-production-h2-image-smoke.mjs


  h4_supply_chain:
    name: Production H4 Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Verify release npm version
        run: test "$(npm --version)" = "10.9.2"

      - name: Install dependencies from frozen lockfile
        run: npm ci

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX application SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > knowledge-ai.sbom.cdx.json

      - name: Verify CycloneDX SBOM
        run: npm run check:production:h4-sbom

      - name: Build exact production image for scan
        run: docker build --tag knowledge-ai:h4-scan .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: knowledge-ai:h4-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
