      - name: Arithmetic grounding proof guard
        run: npx tsx scripts/check-arithmetic-grounding.ts

      - name: Deterministic synthesis guard
        run: npx tsx scripts/check-deterministic-synthesis.ts

      - name: Unseen-corpus effectiveness benchmark
        run: npm run benchmark:unseen

      - name: Live Gemini unseen-corpus benchmark
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "LIVE_GEMINI_BENCHMARK_SKIPPED: GEMINI_API_KEY repository secret is not configured."
            exit 0
          fi
          npm run benchmark:unseen:gemini

  postgres-a2:
    name: Production A2 PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/knowledge_ai_test
      DATABASE_SSL: disable
      DATABASE_POOL_MAX: 5
      KNOWLEDGE_AI_PERSISTENCE_MODE: postgres
      KNOWLEDGE_AI_ALLOW_DEFAULT_WEB: 'true'

