name: H2 Lockfile Refresh

on:
  push:
    branches:
      - production-h2-reproducible-build-image
    paths:
      - package.json
      - .github/workflows/h2-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H2 branch
        uses: actions/checkout@v4
        with:
          ref: production-h2-reproducible-build-image

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Verify release npm version
        shell: bash
        run: |
          test "$(npm --version)" = "10.9.2"

      - name: Generate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove non-canonical Bun lockfile
        run: rm -f bun.lock

      - name: Commit canonical lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- package-lock.json bun.lock
          if git diff --cached --quiet; then
            echo "Canonical lockfile already current."
            exit 0
          fi
          git commit -m "build: commit canonical npm lockfile"
          git push origin HEAD:production-h2-reproducible-build-image
